# Untrusted half of the PR-review pipeline for this public repo: runs on the
# plain `pull_request` trigger (not `pull_request_target`), so it gets a
# read-only, repo-scoped token and no org secrets even for a PR from a
# fork — the actual security boundary, per
# flockdeck-planning/06-contributor-workflow.md (b.1). It only computes a
# diff and uploads it as an artifact; pr-review-post.yml, triggered
# separately afterwards, is what reviews and comments.
name: PR review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  diff:
    # Pinned to a commit, not @main: flockdeck is a much larger, more active
    # repo, and this call is what a fork PR's untrusted job actually runs --
    # a moving ref would let anyone who can merge there change what runs
    # here without a change ever landing in this repo.
    uses: Flockdeck/flockdeck/.github/workflows/reusable-pr-diff.yml@1ad5ab0adf5909c9bd85fcff802c4a5268b14378
    with:
      pr-number: ${{ github.event.pull_request.number }}
      head-sha: ${{ github.event.pull_request.head.sha }}
      base-ref: ${{ github.event.pull_request.base.ref }}
