# nginx:alpine's own default server, with the same four additions as
# flockdeck-site's: text is compressed, every answer carries the security
# headers below, no access log is kept, and versions are hidden.
#
# Unlike flockdeck-site, nothing here is served under a fingerprinted name:
# a docs site regenerates on every push to main rather than on a release, so
# the win a year-long cache gets flockdeck-site's install scripts is not
# worth a second asset pipeline here. Every file is revalidated on every use
# instead (no-cache; the ETag nginx sends by default makes an unchanged
# answer a 304), so a visit after a deploy always gets what was just
# published.
#
# The Dockerfile moves this file into conf.d, so it is not served as a page.
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    server_tokens off;

    access_log    off;
    log_not_found off;

    root   /usr/share/nginx/html;
    index  index.html;

    gzip            on;
    gzip_vary       on;
    gzip_min_length 512;
    gzip_types      text/css text/plain image/svg+xml application/javascript;

    location / {
        add_header Cache-Control "no-cache";
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "DENY" always;
    }

    error_page   500 502 503 504  /50x.html;
}
